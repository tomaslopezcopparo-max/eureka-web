<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan de 90 días · Eureka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Open Sauce Sans";src:url("../../design-system/fonts/OpenSauceSans-400.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Open Sauce Sans";src:url("../../design-system/fonts/OpenSauceSans-700.woff2") format("woff2");font-weight:700;font-display:swap}
/* Documento para cliente: una columna, marca Eureka (solo tema claro, como el resto de piezas para clientes).
   Se imprime a PDF A4 desde el navegador. */
:root{
  --azul:#04298a; --azul-600:#1f3fa8; --violeta:#1f0249; --cian:#aef6ff; --cian-brillo:#bbfcff;
  --fondo:#eeeeee; --panel:#ffffff; --tinta:#04298a; --tinta-2:#4a5a8f; --tinta-3:#7a86ad;
  --linea:rgba(4,41,138,.12); --suave:rgba(4,41,138,.05);
  --v1:#04298a; --v2:#3f6be0; --v3:#8fb4ff; --v4:#c7d4f5;
  --ok:#0f7a4a; --ok-bg:#e1f5ea; --warn:#8a5a00; --warn-bg:#fff1cc;
  --sans:"Open Sauce Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc{background:var(--panel);border:1.5px solid var(--linea);border-radius:16px;overflow:hidden}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.05em;line-height:1.02;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.194em;text-transform:uppercase;color:var(--tinta-3)}
.num{font-variant-numeric:tabular-nums}

/* Portada */
.top{background:var(--azul);color:var(--fondo);padding:28px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;isolation:isolate}
.top::after{content:"";position:absolute;width:300px;height:300px;right:-110px;top:-140px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--cian-brillo),var(--violeta) 70%);opacity:.4;z-index:-1}
.top .eyebrow{color:var(--cian)}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.logo{font-weight:400;letter-spacing:-.085em;font-size:28px;line-height:.83}
.top h1{font-size:clamp(32px,5vw,52px);margin-top:8px}
.top .sub{color:var(--cian);font-size:16px;margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:13px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.meta dd{margin:0;font-weight:500}
.flag{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--cian);color:var(--cian);border-radius:999px;padding:3px 10px}

.body{padding:28px;display:flex;flex-direction:column;gap:36px}
section{display:flex;flex-direction:column;gap:14px}
.sh{display:flex;flex-direction:column;gap:6px}
.sh h2{font-size:26px}
.sh p{color:var(--tinta-2);max-width:66ch}

/* Objetivo */
.goal{background:var(--suave);border-radius:12px;padding:18px 20px;font-size:18px;letter-spacing:-.01em;max-width:none}

/* Hallazgos */
.found{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.found li{border:1.5px solid var(--linea);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.found .v{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.found .why{color:var(--tinta-2);font-size:13px}

/* Grilla */
.grid90{display:grid;grid-template-columns:128px repeat(3,minmax(0,1fr));gap:8px}
.ph{font-size:13px;font-weight:500;color:var(--tinta-2);padding:0 4px 2px;display:flex;flex-direction:column}
.ph span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.ph small{font-size:12px;color:var(--tinta-3);font-weight:400}
.rowh{display:flex;align-items:flex-start;gap:8px;padding-top:12px;font-weight:700;font-size:14px}
.rowh i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.cell{background:var(--suave);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;min-width:0;border-top:3px solid var(--vc)}
.cell .mph{display:none}
.tasks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.tasks li{display:grid;grid-template-columns:14px 1fr;gap:6px;align-items:start}
.tasks li::before{content:"";width:10px;height:10px;margin-top:4px;border-radius:3px;border:1.5px solid var(--tinta-3)}
.tasks li.curso::before{border-color:var(--azul-600);background:linear-gradient(90deg,var(--azul-600) 50%,transparent 50%)}
.tasks li.hecho::before{border-color:var(--ok);background:var(--ok)}
.tasks li.hecho{color:var(--tinta-3);text-decoration:line-through;text-decoration-color:var(--linea)}
.kpi{margin-top:auto;font-size:12px;border-radius:6px;padding:6px 8px;font-weight:500;background:var(--panel);border:1.5px solid var(--linea);display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);font-weight:500}
.kpi.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)} .kpi.ok b{color:var(--ok)}
.kpi.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .kpi.warn b{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--tinta-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--tinta-3)}
.legend i.c{border-color:var(--azul-600);background:linear-gradient(90deg,var(--azul-600) 50%,transparent 50%)}
.legend i.h{border-color:var(--ok);background:var(--ok)}

/* Dos columnas */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.two > section{min-width:0}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--linea);font-size:14px}
.list li:last-child{border-bottom:0}
.list .when{color:var(--tinta-3);font-size:13px;white-space:nowrap}

/* Revisiones */
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{border:1.5px dashed var(--linea);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.check .d{display:flex;align-items:baseline;gap:8px}
.check .d b{font-size:28px;font-weight:400;letter-spacing:-.05em;line-height:1;color:var(--azul-600)}
.check .d span{font-size:12px;color:var(--tinta-3)}
.check p{color:var(--tinta-2);font-size:13.5px}

.foot{border-top:1.5px solid var(--linea);padding:18px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tinta-3)}

@media (max-width:820px){
  .top,.body{padding:22px 18px}
  .foot{padding:16px 18px}
  .grid90{grid-template-columns:1fr}
  .grid90 .ph,.grid90 .corner{display:none}
  .cell .mph{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);font-weight:500}
  .two,.checks{grid-template-columns:1fr}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .wrap{padding:0;max-width:none}
  .doc{border:0;border-radius:0}
  .top,.cell,.kpi,.goal{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  section,.cell,.check{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap"><article class="doc" id="doc"></article></div>

<script>
/* ============================================================
   COMPLETAR POR CLIENTE
   Copiá esta carpeta, cambiá solo este bloque y abrí el archivo.
   - estado de cada tarea: "pendiente" | "curso" | "hecho"
   - estado de cada hito: "" (sin medir) | "ok" (cumplido) | "warn" (en riesgo)
   - Si una vertical no está contratada, borrala de "verticales".
   ============================================================ */
const PLAN = {
  ejemplo: true, // poner en false con un cliente real (saca la etiqueta "Ejemplo")
  cliente: "Café Norte",
  rubro: "Cafetería de especialidad · Rosario",
  inicio: "2026-12-01", // AAAA-MM-DD, día 1 del plan
  responsable: "Equipo Eureka",
  objetivo: "Que Café Norte sea la primera opción del barrio para el café de la mañana, y duplicar los pedidos por WhatsApp en 90 días.",

  hallazgos: [
    { vertical: "Marca", texto: "El Instagram no se parece al local: fotos de stock y tres tipografías distintas.", porque: "Por eso la marca arranca por ordenar identidad antes de producir más." },
    { vertical: "Anuncios", texto: "Usan el botón Promocionar sin píxel. No se sabe qué venta vino de dónde.", porque: "Por eso el primer mes es tracking, no presupuesto." },
    { vertical: "Contenidos", texto: "Publican sin calendario. Los reels del barista tienen 5x más alcance que el resto.", porque: "Por eso el barista pasa a ser el formato central." }
  ],

  verticales: [
    { nombre: "Marca", fases: [
      { tareas: [["Tono de voz y paleta","hecho"],["Una sola tipografía","curso"],["Plantillas de posteo","pendiente"]], hito: "Manual de marca entregado", estado: "" },
      { tareas: [["Perfil, carta y vidriera alineados","pendiente"],["Sesión de fotos propia","pendiente"]], hito: "100% del feed con fotos propias", estado: "" },
      { tareas: [["Ajustes según qué piezas funcionan","pendiente"],["Packaging para llevar","pendiente"]], hito: "+20% de seguidores del barrio", estado: "" }
    ]},
    { nombre: "Anuncios", fases: [
      { tareas: [["Píxel y eventos de WhatsApp","curso"],["Cuenta publicitaria ordenada","pendiente"],["3 creativos de prueba","pendiente"]], hito: "Tracking funcionando", estado: "" },
      { tareas: [["Test de audiencias a 2 km del local","pendiente"],["Creativos con el barista","pendiente"]], hito: "Costo por mensaje menor a $900", estado: "" },
      { tareas: [["Más presupuesto a lo que convierte","pendiente"],["Remarketing a quien escribió","pendiente"]], hito: "2x pedidos por WhatsApp", estado: "" }
    ]},
    { nombre: "Contenidos", fases: [
      { tareas: [["3 pilares: café, barrio, equipo","hecho"],["Calendario mensual","curso"]], hito: "12 piezas publicadas", estado: "" },
      { tareas: [["Serie semanal del barista","pendiente"],["Producción por tandas","pendiente"]], hito: "Alcance mensual x3", estado: "" },
      { tareas: [["Duplicar formatos ganadores","pendiente"],["Reels pensados para pauta","pendiente"]], hito: "2 reels con más de 10.000 vistas", estado: "" }
    ]}
  ],

  // Lo que necesitamos del cliente para cumplir el plan
  necesitamos: [
    ["Accesos a Meta Business y a Instagram", "Semana 1"],
    ["Medio día en el local para la sesión de fotos", "Día 35"],
    ["Aprobar el calendario de cada mes", "Antes del día 1 de cada mes"],
    ["Presupuesto de pauta acordado", "Desde el día 31"]
  ],

  // Cómo vamos a medir y dónde se ve
  medimos: [
    ["Mensajes de WhatsApp desde anuncios", "Meta Ads"],
    ["Alcance y seguidores del barrio", "Instagram"],
    ["Pedidos por WhatsApp", "Registro del local"]
  ],

  revisiones: [
    "¿Está la base? Si el tracking no funciona, no se escala.",
    "Primeros números. Cortamos lo que no rinde y reforzamos lo que sí.",
    "Resultados contra los hitos y propuesta de los próximos 90 días."
  ]
};

/* ============================================================
   De acá para abajo no hace falta tocar nada.
   ============================================================ */
const FASES = [["Días 1–30","Base",0,29],["Días 31–60","Activación",30,59],["Días 61–90","Escala",60,89]];
const COLORES = ["var(--v1)","var(--v2)","var(--v3)","var(--v4)"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d0 = new Date(PLAN.inicio + "T12:00:00");
const fecha = (n, opt) => { const d = new Date(d0); d.setDate(d.getDate() + n); return d.toLocaleDateString("es-AR", opt || {day:"numeric", month:"short"}); };
const colorDe = nombre => { const i = PLAN.verticales.findIndex(v => v.nombre === nombre); return COLORES[Math.max(0, i) % COLORES.length]; };

const head = FASES.map(([d,n,a,b]) => `<div class="ph"><span>${d}</span>${n}<small class="num">${fecha(a)} – ${fecha(b)}</small></div>`).join("");
const rows = PLAN.verticales.map((v, i) => {
  const c = COLORES[i % COLORES.length];
  const cells = v.fases.map((f, j) => `
    <div class="cell" style="--vc:${c}">
      <span class="mph">${FASES[j][0]} · ${FASES[j][1]}</span>
      <ul class="tasks">${f.tareas.map(([t, e]) => `<li class="${esc(e)}">${esc(t)}</li>`).join("")}</ul>
      <div class="kpi ${esc(f.estado || "")}"><b>Hito${f.estado === "ok" ? " · cumplido" : f.estado === "warn" ? " · en riesgo" : ""}</b>${esc(f.hito)}</div>
    </div>`).join("");
  return `<div class="rowh"><i style="background:${c}"></i>${esc(v.nombre)}</div>${cells}`;
}).join("");

document.title = `Plan de 90 días · ${PLAN.cliente} · Eureka`;
document.getElementById("doc").innerHTML = `
  <header class="top">
    <div class="top-row">
      <span class="logo">eureka</span>
      ${PLAN.ejemplo ? '<span class="flag">Ejemplo</span>' : ""}
    </div>
    <div>
      <span class="eyebrow">Plan de 90 días</span>
      <h1>${esc(PLAN.cliente)}</h1>
      <p class="sub">${esc(PLAN.rubro)}</p>
    </div>
    <dl class="meta" style="margin:0">
      <div><dt>Inicio</dt><dd class="num">${fecha(0, {day:"numeric", month:"long", year:"numeric"})}</dd></div>
      <div><dt>Cierre</dt><dd class="num">${fecha(89, {day:"numeric", month:"long", year:"numeric"})}</dd></div>
      <div><dt>Verticales</dt><dd>${PLAN.verticales.map(v => esc(v.nombre)).join(" · ")}</dd></div>
      <div><dt>Responsable</dt><dd>${esc(PLAN.responsable)}</dd></div>
    </dl>
  </header>

  <div class="body">
    <section>
      <div class="sh"><span class="eyebrow">Objetivo de los 90 días</span></div>
      <p class="goal">${esc(PLAN.objetivo)}</p>
    </section>

    <section>
      <div class="sh"><span class="eyebrow">1 · Lo que vimos</span><h2>El diagnóstico, en ${PLAN.hallazgos.length} puntos</h2><p>Cada tarea del plan sale de uno de estos hallazgos.</p></div>
      <ul class="found">${PLAN.hallazgos.map(h => `
        <li><span class="v" style="color:${colorDe(h.vertical)}">${esc(h.vertical)}</span>${esc(h.texto)}${h.porque ? `<span class="why">${esc(h.porque)}</span>` : ""}</li>`).join("")}
      </ul>
    </section>

    <section>
      <div class="sh"><span class="eyebrow">2 · El plan</span><h2>Qué hacemos en cada vertical, mes a mes</h2><p>Cada casillero cierra con un hito: es lo que miramos en la revisión de ese mes.</p></div>
      <div class="grid90"><div class="corner"></div>${head}${rows}</div>
      <div class="legend"><span><i></i>Pendiente</span><span><i class="c"></i>En curso</span><span><i class="h"></i>Hecho</span></div>
    </section>

    <div class="two">
      <section>
        <div class="sh"><span class="eyebrow">3 · Lo que necesitamos de vos</span></div>
        <ul class="list">${PLAN.necesitamos.map(([q, w]) => `<li><span>${esc(q)}</span><span class="when">${esc(w)}</span></li>`).join("")}</ul>
      </section>
      <section>
        <div class="sh"><span class="eyebrow">4 · Cómo lo medimos</span></div>
        <ul class="list">${PLAN.medimos.map(([q, w]) => `<li><span>${esc(q)}</span><span class="when">${esc(w)}</span></li>`).join("")}</ul>
      </section>
    </div>

    <section>
      <div class="sh"><span class="eyebrow">5 · Revisiones</span><h2>Nos juntamos tres veces</h2></div>
      <div class="checks">${PLAN.revisiones.map((t, i) => { const n = (i + 1) * 30; return `
        <div class="check"><div class="d"><b class="num">Día ${n}</b><span class="num">${fecha(n - 1, {weekday:"short", day:"numeric", month:"short"})}</span></div><p>${esc(t)}</p></div>`; }).join("")}
      </div>
    </section>
  </div>

  <footer class="foot"><span>Eureka · Plan de 90 días para ${esc(PLAN.cliente)}</span><span>Documento vivo: se actualiza en cada revisión.</span></footer>`;
</script>
</body>
</html>
